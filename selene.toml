# Selene configuration for Luau
# https://github.com/Kampfkarren/selene

[display]
info = false

[roblox]
std = "roblox"
global_env = "luau"
target = "roblox"

[linter]
severity = "warn"
roblox_security_check = true
no_shadow = false
no_global_usage = true
no_unused_variables = true
no_redundant_await = true
no_empty_loop = true
no_imprecise_numeric_literal = true
no_unnecessary_numeric_cast = false
no_duplicate_keys = true
no_duplicate_cases = true
no_if_same_then_else = true
no_self_compare = true
no_div_by_zero = true
no_table_constructor_empty = true
no_mixed_tables = true
no_unreachable_code = true
no_nil_cyclic_require = true
no_global_assign = true
no_invalid_method_name = true

[linter.allow]
empty_if = false
multiple_statements = false
unscoped_variables = false
global_usage = [
    "game",
    "workspace",
    "script",
    "require",
    "print",
    "warn",
    "error",
    "assert",
    "type",
