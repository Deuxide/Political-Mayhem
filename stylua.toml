# StyLua configuration for Luau
# https://github.com/JohnnyMorganz/StyLua

indent_width = 4
indent_type = "Tabs"
column_width = 100
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
# "Never" (StyLua's default) is required: "Always" collapses single-statement
# function/if bodies onto one line, which Selene's multiple_statements rule
# rejects, so no formatting could pass both tools (D-037).
collapse_simple_statement = "Never"